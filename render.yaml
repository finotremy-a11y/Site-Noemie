services:
  - type: web
    name: nlcuisinent-web
    runtime: ruby
    runtimeVersion: 3.3
    buildCommand: bundle install && rails assets:precompile && rails db:migrate
    startCommand: bundle exec puma -t 5:5 -p ${PORT:-3000}
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: APP_HOST
        value: nlcuisinent-web.onrender.com
      - key: APP_PROTOCOL
        value: https
      - key: FORCE_SSL
        value: true
      - key: SOLID_QUEUE_IN_PUMA
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: nlcuisinent-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nlcuisinent-redis
          property: connectionString
      # Stripe
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Observabilité
      - key: SENTRY_DSN_BACKEND
        sync: false
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Resend emailer
      - key: RESEND_API_KEY
        sync: false
      # Admin
      - key: ADMIN_API_TOKEN
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
    healthCheckPath: /api/v1/health

  - type: redis
    name: nlcuisinent-redis

databases:
  - name: nlcuisinent-postgres
    databaseName: nlcuisinent_prod
    user: nlcuisinent
    region: frankfurt
    plan: starter
